<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand Mention & Reputation Tracker - No CSS</title>
  </head>
  <body style="background: #f0f0f0; padding: 20px; font-family: Arial, sans-serif;">
    <h1 style="color: #333;">🚀 Brand Tracker - No CSS Test</h1>
    <div id="root" style="border: 2px solid red; min-height: 200px; padding: 10px; background: white;">
      <div style="text-align: center; padding: 50px; background: #e0e0e0; margin: 20px;">
        <h2>⏳ Loading React App...</h2>
        <p>If you see this message for more than 5 seconds, React is not mounting.</p>
        <p id="timer">Timer: 0s</p>
      </div>
    </div>

    <div style="margin-top: 20px; padding: 20px; background: #fff3cd; border: 1px solid #ffeaa7;">
      <h3>🔍 Debug Information</h3>
      <p><strong>Purpose:</strong> Test if React loads without complex CSS</p>
      <p><strong>Expected:</strong> React should replace the content above</p>
      <p><strong>Root Element:</strong> <span id="root-info">Checking...</span></p>
    </div>

    <script>
      let seconds = 0;
      const timer = setInterval(() => {
        seconds++;
        document.getElementById('timer').textContent = `Timer: ${seconds}s`;
        
        if (seconds >= 10) {
          clearInterval(timer);
          document.getElementById('root-info').innerHTML = '❌ React failed to mount after 10 seconds';
          document.getElementById('root-info').style.color = 'red';
        }
      }, 1000);
      
      // Check root element
      setTimeout(() => {
        const root = document.getElementById('root');
        const children = root.children.length;
        document.getElementById('root-info').textContent = `Root has ${children} children`;
        
        if (children > 1) {
          document.getElementById('root-info').style.color = 'green';
          document.getElementById('root-info').textContent += ' ✅ React likely mounted';
          clearInterval(timer);
        }
      }, 2000);
      
      console.log('No-CSS test loaded');
    </script>

    <!-- Load the actual React app -->
    <script type="module" crossorigin src="/assets/index-BPdW6qKN.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BcQ041wz.css">
  </body>
</html>
