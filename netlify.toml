# 🚀 Netlify Deployment Configuration for Brand Tracker
# RapidQuest Hackathon 2025 - Full Stack Deployment

[build]
  # Frontend build configuration
  base = "frontend"
  publish = "frontend/dist"
  command = "npm install && npm run build"

[build.environment]
  # Frontend environment variables
  VITE_API_BASE_URL = "https://brand-tracker-api.netlify.app/.netlify/functions"
  NODE_VERSION = "18"

# 🔧 Serverless Functions for Backend API
[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"

# 🌐 Redirects and rewrites for SPA
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 🔒 Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://newsapi.org https://*.netlify.app; frame-ancestors 'none';"

